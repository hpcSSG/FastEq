  seed: 42
  train_dataloader:
    _target_: torch.utils.data.DataLoader
    batch_size: 160
    num_workers: 8
    shuffle: true
  val_dataloader:
    _target_: torch.utils.data.DataLoader
    batch_size: 160
    num_workers: 8
trainer:
  _target_: lightning.Trainer
  gradient_clip_val: 1
  strategy:
    _target_: nequip.train.SimpleDDPStrategy
  accelerator: gpu
  enable_checkpointing: true
  max_time: '30:00:00:00'
  max_epochs: 1000
  check_val_every_n_epoch: 1
  log_every_n_steps: 10000
  callbacks:
  - _target_: lightning.pytorch.callbacks.ModelCheckpoint
    monitor: val0_epoch/weighted_sum
    dirpath: /global/cfs/cdirs/m4297/sean/Nequip_MPA/OAM_LR_1e-3_from_NL_6_ZBL_l_3_EO_LR_5e-3_256_6_EF_SWA_nTF32_LR_1e-4/ckpts/nequip_MPA
    filename: weighted_metric_{val0_epoch/weighted_sum:.4f}-{epoch}
    auto_insert_metric_name: false
    save_last: true
    verbose: true
    save_top_k: -1
  - _target_: lightning.pytorch.callbacks.EarlyStopping
    verbose: true
    log_rank_zero_only: true
    monitor: val0_epoch/weighted_sum
    min_delta: 1.0e-05
    patience: 80
  - _target_: lightning.pytorch.callbacks.LearningRateMonitor
    logging_interval: epoch
  - _target_: nequip.train.callbacks.LossCoefficientMonitor
    frequency: 1
    interval: epoch
  - _target_: lightning.pytorch.callbacks.StochasticWeightAveraging
    swa_lrs: 0.0001
    swa_epoch_start: 1
    annealing_epochs: 1
    annealing_strategy: linear
  logger:
    _target_: lightning.pytorch.loggers.wandb.WandbLogger
    save_dir: /global/cfs/cdirs/m4297/sean/Nequip_MPA/OAM_LR_1e-3_from_NL_6_ZBL_l_3_EO_LR_5e-3_256_6_EF_SWA_nTF32_LR_1e-4/ckpts/nequip_MPA
    project: MPA
    name: OAM_LR_1e-3_from_NL_6_ZBL_l_3_EO_LR_5e-3_256_6_EF_SWA_nTF32_LR_1e-4
  num_nodes: 1
global_options:
  allow_tf32: false
runs:
- val
- train
training_module:
  _target_: nequip.train.EMALightningModule
  ema_decay: 0.995
  loss:
    _target_: nequip.train.MetricsManager
    metrics:
    - name: peratom_E_Huber
      field:
        _target_: nequip.data.PerAtomModifier
        field: total_energy
      coeff: 1
      metric:
        _target_: nequip.train.HuberLoss
        delta: 0.01
    - name: force_strat_E_huber
      field: forces
      coeff: 1
      metric:
        _target_: nequip.train.metrics.StratifiedHuberForceLoss
        delta_dict:
          0: 0.01
          100: 0.007
          200: 0.004
          300: 0.001
    - name: stress_E_Huber
      field: stress
      coeff: 0.1
      metric:
        _target_: nequip.train.HuberLoss
        delta: 0.1
  val_metrics:
    _target_: nequip.train.EnergyForceStressMetrics
    coeffs:
      per_atom_energy_rmse: 1.0
      forces_rmse: 1.0
      stress_rmse: 1.0
      total_energy_mae: 1.0
      per_atom_energy_mae: 5.0
      forces_mae: 5.0
      stress_mae: 2.5
  train_metrics:
    _target_: nequip.train.EnergyForceStressMetrics
    coeffs:
      per_atom_energy_rmse: 1.0
      forces_rmse: 1.0
      stress_rmse: 1.0
      total_energy_mae: 1.0
      per_atom_energy_mae: 5.0
      forces_mae: 5.0
      stress_mae: 2.5
  optimizer:
    _target_: torch.optim.AdamW
    lr: 0.0001
    weight_decay: 1.0e-08
    amsgrad: false
  lr_scheduler:
    scheduler:
      _target_: torch.optim.lr_scheduler.ReduceLROnPlateau
      factor: 0.1
      patience: 100
      min_lr: 1.0e-06
    monitor: val0_epoch/weighted_sum
    interval: epoch
    frequency: 1
  model:
    _target_: nequip.model.modify
    modifiers:
    - modifier: enable_OpenEquivariance
    - modifier: modify_PerTypeScaleShift
      shifts:
        H: -1.1176
        He: -0.0005
        Li: -0.2974
        Be: -0.0181
        B: -0.4447
        C: -1.3865
        'N': -3.1256
        O: -1.9067
